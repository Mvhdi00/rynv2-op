<!doctype html><meta charset=utf-8><body style="margin:0;background:#111">
<canvas id=c></canvas>
<script>
const W = 1920, H = 1080;
const c = document.getElementById('c');
const x = c.getContext('2d');

function fitCanvas(density) {
  c.width  = Math.round(W * density);
  c.height = Math.round(H * density);
  c.style.width = W + 'px'; c.style.height = H + 'px';
  x.setTransform(density, 0, 0, density, 0, 0);
}

// --- the exact hot paths the patch touches -------------------------------
function vignetteUncached() {
  const g = x.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
  g.addColorStop(0, "rgba(0,0,0,0.10)");
  g.addColorStop(0.5, "rgba(0,0,0,0.20)");
  g.addColorStop(1, "rgba(0,0,0,0.30)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
}
let cached = null;
function vignetteCached() {
  if (!cached) {
    cached = x.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
    cached.addColorStop(0, "rgba(0,0,0,0.10)");
    cached.addColorStop(0.5, "rgba(0,0,0,0.20)");
    cached.addColorStop(1, "rgba(0,0,0,0.30)");
  }
  x.fillStyle = cached; x.fillRect(0, 0, W, H);
}
const objs = [];
for (let i = 0; i < 40; i++) objs.push({ x: Math.random()*W, y: Math.random()*H, arc: Math.random()*6.28 });
function rings(dbl) {
  x.lineCap = "round";
  for (const o of objs) {
    if (dbl) { x.strokeStyle = "#3d3f42"; x.lineWidth = 12.5;
      x.beginPath(); x.arc(o.x, o.y, 33, 0, o.arc); x.stroke(); }
    x.strokeStyle = "#ff0000"; x.lineWidth = 5;
    x.beginPath(); x.arc(o.x, o.y, 33, 0, o.arc); x.stroke();
  }
}
const names = [];
for (let i = 0; i < 15; i++) names.push({ n: "Player" + i, x: Math.random()*W, y: Math.random()*H });
function drawNames(withIcons) {
  x.font = "30px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.lineWidth = 8; x.lineJoin = "round"; x.strokeStyle = "#3d3f42"; x.fillStyle = "#fff";
  for (const p of names) {
    x.strokeText(p.n, p.x, p.y); x.fillText(p.n, p.x, p.y);
    if (withIcons) { x.measureText(p.n); x.measureText(p.n); }   // crown + skull
  }
}
function scene() {                      // a rough stand-in for the base pass
  x.fillStyle = "#b6db66"; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 120; i++) {
    x.fillStyle = i % 3 ? "#9c6644" : "#8ecc51";
    x.beginPath(); x.arc((i*137)%W, (i*271)%H, 45, 0, 6.283); x.fill();
    x.lineWidth = 5.5; x.strokeStyle = "#3d3f42"; x.stroke();
  }
}

// Canvas draw calls are deferred: timing them without a sync point measures
// command submission, not the work. Reading one pixel forces the pipeline to
// flush, so each frame's GPU cost lands inside its own measurement.
function flush() { x.getImageData(0, 0, 1, 1); }
function time(fn, frames) {
  for (let i = 0; i < 30; i++) { fn(); flush(); }        // warm
  const t = [];
  for (let i = 0; i < frames; i++) {
    const t0 = performance.now();
    fn(); flush();
    t.push(performance.now() - t0);
  }
  t.sort((a, b) => a - b);
  return t[Math.floor(t.length / 2)];                    // median frame
}
// Cost of the sync point itself, subtracted out below.
function baseline() { return time(() => {}, 200); }

window.RESULTS = (() => {
  const out = {};
  fitCanvas(1);
  const base = baseline();
  out._baseline = base;
  out.vignette_uncached = time(vignetteUncached, 300) - base;
  out.vignette_cached   = time(vignetteCached, 300) - base;
  out.rings_double      = time(() => rings(true), 300) - base;
  out.rings_single      = time(() => rings(false), 300) - base;
  out.names_with_icons  = time(() => drawNames(true), 300) - base;
  out.names_no_icons    = time(() => drawNames(false), 300) - base;
  out.scene_100         = time(scene, 200) - base;
  fitCanvas(0.7);  out.scene_70 = time(scene, 200) - base;
  fitCanvas(0.5);  out.scene_50 = time(scene, 200) - base;
  fitCanvas(1);
  return out;
})();
</script>
